<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKX Trading Console</title>
  <link rel="stylesheet" href="/style.css?v=20260519_full_migration">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>OKX Trading Console</h1>
        <p id="systemStatus">loading...</p>
      </div>
    </header>

    <section class="launch-window">
      <div class="panel">
        <div class="panel-head">
          <h2>数据更新</h2>
          <div class="panel-actions">
            <button id="dataRefreshStartBtn" type="button">启动/刷新数据</button>
            <div class="status-pill" id="readinessPill">checking</div>
          </div>
        </div>
        <div id="dataReadinessDetails" class="readiness-details"></div>
        <div id="dataCategories" class="data-grid"></div>
        <pre id="dataLog" class="log-box">loading...</pre>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>账户资金</h2>
          <span id="accountsUpdated">--</span>
        </div>
        <div id="accountCards" class="account-grid"></div>
        <div id="operationLog" class="operation-log">等待操作</div>
      </div>
    </section>

    <nav class="main-nav" aria-label="主页面">
      <button class="active" type="button" data-page="strategies">策略</button>
      <button type="button" data-page="personal">个人</button>
      <button type="button" data-page="competition">比赛</button>
    </nav>

    <section class="app-page active" id="page-strategies">
      <section class="panel">
        <div class="panel-head">
          <h2>策略总览</h2>
          <span id="strategyUpdated">--</span>
        </div>
        <div id="strategySummary" class="summary-line">--</div>
        <canvas id="strategyChart" class="equity-chart" width="1200" height="260"></canvas>
        <div id="strategyList" class="strategy-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>委员会决策</h2>
          <span id="committeeUpdated">--</span>
        </div>
        <div id="committeeLog" class="decision-list"></div>
      </section>
    </section>

    <section class="app-page" id="page-personal">
      <section class="panel account-page">
        <div class="panel-head">
          <h2>个人账户</h2>
          <div class="panel-actions">
            <button id="personalStartBtn" type="button">启动个人</button>
            <button id="personalStopBtn" class="danger" type="button">暂停个人</button>
            <button id="personalCloseAllBtn" class="danger" type="button">一键清仓</button>
          </div>
        </div>
        <div id="personalFeedback" class="feedback">等待操作</div>
        <div id="personalMetrics" class="metrics"></div>
        <div class="split-grid">
          <div>
            <h3>持仓</h3>
            <div id="personalPositions" class="position-list"></div>
          </div>
          <div>
            <h3>运行状态</h3>
            <div id="personalRuntime" class="runtime-card"></div>
          </div>
        </div>
        <h3 class="section-subhead">交易记录</h3>
        <div id="personalHistory" class="history-list"></div>
      </section>
    </section>

    <section class="app-page" id="page-competition">
      <section class="panel account-page">
        <div class="panel-head">
          <h2>比赛账户</h2>
          <div class="panel-actions">
            <button id="competitionStartBtn" type="button">启动比赛</button>
            <button id="competitionStopBtn" class="danger" type="button">暂停比赛</button>
            <button id="competitionCloseAllBtn" class="danger" type="button">一键清仓</button>
          </div>
        </div>
        <div id="competitionFeedback" class="feedback">等待操作</div>
        <div id="competitionMetrics" class="metrics"></div>
        <div class="split-grid">
          <div>
            <h3>持仓</h3>
            <div id="competitionPositions" class="position-list"></div>
          </div>
          <div>
            <h3>运行状态</h3>
            <div id="competitionRuntime" class="runtime-card"></div>
          </div>
        </div>
        <h3 class="section-subhead">交易记录</h3>
        <div id="competitionHistory" class="history-list"></div>
      </section>
    </section>
  </main>

  <script src="/app.js?v=20260519_full_migration"></script>
</body>
</html>
